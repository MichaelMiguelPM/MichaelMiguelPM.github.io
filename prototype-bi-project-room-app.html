  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ck; color:var(--ink); font-size:13px; font-weight:600;}\n  .room-item .tx span{color:var(--ink-3); font-size:11.5px;}\n  .room-item .open{\n    color:var(--accent); font-weight:600; font-size:12.5px; text-decoration:none;\n  }\n\n  /* Team + Activity side-by-side: Activity 2/3, Team 1/3 */\n  .team-activity-grid{\n    display:grid;\n    grid-template-columns: 2fr 1fr;\n    gap:14px;\n    align-items:start;\n  }\n  @media (max-width: 760px){\n    .team-activity-grid{ grid-template-columns: 1fr; }\n  }\n\n  /* Rail cards */\n  .rail-card{\n    background:var(--panel);\n    border:1px solid var(--line);\n    border-radius:var(--radius-lg);\n    padding:12px 14px;\n    box-shadow:var(--shadow);\n  }\n\n  /* Activity hub: tabbed Activity / Chat / History */\n  .activity-hub{padding:0;}\n  .hub-tabs{\n    display:flex; gap:0;\n    padding:0 14px;\n    border-bottom:1px solid var(--line);\n    background:transparent;\n    border-radius:var(--radius-lg) var(--radius-lg) 0 0;\n  }\n  .hub-tab{\n    cursor:pointer;\n    background:transparent; border:0;\n    font-family:inherit; font-size:13px; font-weight:600;\n    color:var(--ink-3);\n    padding:12px 4px;\n    margin-right:18px;\n    border-radius:0;\n    border-bottom:2px solid transparent;\n    display:inline-flex; align-items:center; justify-content:center; gap:6px;\n    transition:color .15s, border-color .15s;\n  }\n  .hub-tab:last-child{margin-right:0;}\n  .hub-tab:hover{color:var(--ink-2); background:transparent;}\n  .hub-tab.on{\n    color:var(--accent-700);\n    background:transparent;\n    border-bottom:2px solid var(--accent);\n    box-shadow:none;\n  }\n  .theme-dark .hub-tab.on{color:#F7B983;}\n  .hub-panel{display:none; padding:14px;}\n  .hub-panel.on{display:block;}\n  .activity-hub .chat-input{margin-top:10px;}\n\n  /* Activity unified list */\n  .act-feed-head{\n    display:flex; align-items:center; justify-content:space-between;\n    font-size:10.5px; font-weight:700; letter-spacing:.12em;\n    text-trans       <span class=\"caret\">⌄<\u002Fspan>\n                <div class=\"menu\">\n                  <div class=\"opt on\">All time<\u002Fdiv>\n                  <div class=\"opt\">Today<\u002Fdiv>\n                  <div class=\"opt\">Last 7 days<\u002Fdiv>\n                  <div class=\"opt\">Last 30 days<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"hist-select\" id=\"filterActions\">\n                <span class=\"lbl\">All actions<\u002Fspan>\n                <span class=\"caret\">⌄<\u002Fspan>\n                <div class=\"menu\">\n                  <div class=\"opt on\">All actions<\u002Fdiv>\n                  <div class=\"opt\">Added<\u002Fdiv>\n                  <div class=\"opt\">Deleted<\u002Fdiv>\n                  <div class=\"opt\">Edited<\u002Fdiv>\n                  <div class=\"opt\">Viewed<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- legacy chip row kept hidden so existing JS hooks still resolve -->\n          <div class=\"hfilters\" id=\"histFilters\" style=\"display:none;\">\n            <span class=\"chip on\" data-f=\"all\">All<\u002Fspan>\n            <span class=\"chip\" data-f=\"whiteboards\">Whiteboards<\u002Fspan>\n            <span class=\"chip\" data-f=\"memos\">Memos<\u002Fspan>\n            <span class=\"chip\" data-f=\"tasks\">Tasks<\u002Fspan>\n            <span class=\"chip\" data-f=\"files\">Files<\u002Fspan>\n            <span class=\"chip\" data-f=\"members\">Members<\u002Fspan>\n            <span class=\"chip\" data-f=\"chat\">Chat<\u002Fspan>\n            <span class=\"chip\" data-f=\"settings\">Settings<\u002Fspan>\n            <span class=\"count\">15 events<\u002Fspan>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <!-- /viewSettings -->\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- TWEAKS -->\n<div class=\"tweaks\" id=\"tweaks\">\n  <h4>Tweaks<\u002Fh4>\n  <div class=\"opts\" id=\"themeOpts\">\n    <button class=\"opt on\" data-theme=\"bold\">\n      <span class=\"sw sw-bold\"><\u002Fspan>BI Match\n    <\u002Fbutton>\n    <button class=\"opt\" data-theme=\"bold-dark\">\n      <span class=\"sw sw-bold-dark\"><\u002Fspan>Hack Dark Mode\n    <\u002Fbutton>\n    <button class=\"opt\" data-theme=\"enterprise\">\n      <span class=\"sw sw-enterprise\"><\u002Fspan>Enterprise\n    <\u002Fbutton>\n    <button class=\"opt\" data-theme=\"enterprise-dark\">\n      <span class=\"sw sw-enterprise-dark\"><\u002Fspan>BI Dark Mode\n    <\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"toggle\">\n    <span id=\"stateLabel\">Empty state<\u002Fspan>\n    <div class=\"swbtn\" id=\"stateSw\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n/*EDITMODE-BEGIN*/\nconst TWEAK_DEFAULTS = {\n  \"theme\": \"bold\",\n  \"filled\": false,\n  \"route\": \"home\",\n  \"tab\": \"settings\"\n};\n/*EDITMODE-END*/\n\nlet state = { ...TWEAK_DEFAULTS };\ntry {\n  const saved = JSON.parse(localStorage.getItem('projectRoomState') || 'null');\n  if (saved) state = { ...state, ...saved };\n} catch(e){}\n\nconst body = document.body;\nconst tweaks = document.getElementById('tweaks');\nconst stateSw = document.getElementById('stateSw');\nconst stateLabel = document.getElementById('stateLabel');\nconst crumb = document.getElementById('crumb');\n\nfunction applyTheme(t){\n  body.classList.remove('theme-original','theme-light','theme-dark','theme-glass','theme-bold','theme-bold-dark','theme-enterprise','theme-enterprise-dark');\n  // Migrate removed themes\n  if (t === 'original' || t === 'light' || t === 'dark' || t === 'glass') t = 'bold';\n  body.classList.add('theme-' + t);\n  document.querySelectorAll('#themeOpts .opt').forEach(b=>{\n    b.classList.toggle('on', b.dataset.theme === t);\n  });\n}\n\nfunction applyState(filled){\n  document.querySelectorAll('.emptyOnly').forEach(el => el.style.display = filled ? 'none' : '');\n  document.querySelectorAll('.filledOnly').forEach(el => el.style.display = filled ? '' : 'none');\n  stateSw.classList.toggle('on', filled);\n  stateLabel.textContent = filled ? 'Filled state' : 'Empty state';\n\n  document.getElementById('heroTitle').textContent = filled\n    ? 'Smart Document Summarizer & Classifier for Financial Advisors'\n    : 'Your New Project Room';\n  document.getElementById('heroMeta').textContent = filled\n    ? '4 members · Hackathon 2024'\n    : '1 member · Hackathon 2024';\n  document.getElementById('heroAvatarSlot').innerHTML = filled\n    ? `<span class=\"hero-stack\">\n         <span class=\"a\" style=\"background:linear-gradient(135deg,#F4A95C,#ED8F38);\">MS<\u002Fspan>\n         <span class=\"a\" style=\"background:linear-gradient(135deg,#A674E3,#7F4ACB);\">JW<\u002Fspan>\n         <span class=\"a\" style=\"background:linear-gradient(135deg,#4CB4B4,#2F8E8E);\">RC<\u002Fspan>\n         <span class=\"a\" style=\"background:linear-gradient(135deg,#E56B5D,#C34A3C);\">AP<\u002Fspan>\n       <\u002Fspan>`\n    : `<span class=\"hero-avatar\">MS<\u002Fspan>`;\n\n  const ht = document.getElementById('hackTitle');\n  if (ht) ht.textContent = 'Hackathon 2024 · Build the Future';\n  const hd = document.getElementById('hackDesc');\n  if (hd) hd.textContent = filled\n    ? 'A 6-week company-wide innovation sprint to incubate, validate and ship new product ideas. Form a team, develop your concept through each phase, and pitch to leadership.'\n    : 'A 6-week company-wide innovation sprint to incubate, validate and ship new product ideas. Form a team, develop your concept through each phase, and pitch to leadership.';\n\n  const ps = document.getElementById('phaseSub');\n  if (ps) ps.textContent = filled ? 'Develop your concept & team' : 'Just kicked off — get your room ready';\n  const pst = document.getElementById('phaseStart');\n  if (pst) pst.textContent = 'Dec 12, 2024';\n  const pss = document.getElementById('phaseStartSub');\n  if (pss) pss.textContent = filled ? '26 days ago' : 'Today';\n  const pes = document.getElementById('phaseEndSub');\n  if (pes) pes.textContent = filled ? 'in 39 days' : 'in 39 days';\n\n  document.getElementById('qaTaskText').textContent = filled ? 'View Open Tasks' : 'Create Task';\n  document.getElementById('teamAction').textContent = filled ? '+ Add' : '+ Invite';\n  document.getElementById('histLabel').textContent = 'History';\n\n  crumb.innerHTML = filled\n    ? 'Project Room v2'\n    : 'Empty State — New Room';\n}\n\nfunction render(){ applyTheme(state.theme); applyState(state.filled); applyRoute(state.route||'home'); applyTab(state.tab||'settings'); persist(); }\nfunction persist(){\n  try { localStorage.setItem('projectRoomState', JSON.stringify(state)); } catch(e){}\n  if (window.parent !== window) {\n    window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ theme:state.theme, filled:state.filled, route:state.route, tab:state.tab } }, '*');\n  }\n}\n\ndocument.querySelectorAll('#themeOpts .opt').forEach(b=>{\n  b.addEventListener('click', ()=>{ state.theme = b.dataset.theme; render(); });\n});\nstateSw.addEventListener('click', ()=>{ state.filled = !state.filled; render(); });\n\n// ROUTING: home / members / history / settings\nconst ROUTE_TO_TAB = { settings:'settings', members:'members', history:'history' };\nconst ROUTE_LABELS = {\n  home: null,\n  settings: 'Project Room Settings',\n  members:  'Team Members',\n  history:  'History'\n};\nfunction applyRoute(route){\n  const isHome = route === 'home';\n  const isSettingsView = !isHome && route !== 'hackathon';\n  document.getElementById('viewHome').classList.toggle('active', isHome);\n  document.getElementById('viewSettings').classList.toggle('active', isSettingsView);\n  document.getElementById('navHome').classList.toggle('active', isHome);\n  document.getElementById('navSettings').classList.toggle('active', route === 'settings');\n  const navMembers = document.getElementById('navMembers');\n  const navHistory = document.getElementById('navHistory');\n  if (navMembers) navMembers.classList.toggle('active', route === 'members');\n  if (navHistory) navHistory.classList.toggle('active', route === 'history');\n  // Drive tab from route when on settings view\n  if (isSettingsView && ROUTE_TO_TAB[route]) {\n    state.tab = ROUTE_TO_TAB[route];\n  }\n  crumb.textContent = ROUTE_LABELS[route] || (state.filled ? 'Project Room v2' : 'Empty State — New Room');\n  // Tabs row is permanently hidden — left nav drives view selection\n  window.scrollTo(0,0);\n}\ndocument.querySelectorAll('[data-route]').forEach(a=>{\n  a.addEventListener('click', (e)=>{ e.preventDefault(); state.route = a.dataset.route; render(); });\n});\n\n// TABS\nfunction applyTab(tab){\n  document.querySelectorAll('#settingsTabs .tab').forEach(b=>{\n    b.classList.toggle('on', b.dataset.tab === tab);\n  });\n  document.querySelectorAll('[data-panel]').forEach(p=>{\n    p.classList.toggle('on', p.dataset.panel === tab);\n  });\n}\ndocument.querySelectorAll('#settingsTabs .tab').forEach(b=>{\n  b.addEventListener('click', ()=>{\n    state.tab = b.dataset.tab;\n    // Sync route to match tab so left nav highlight reflects view\n    const tabToRoute = { settings:'settings', members:'members', history:'history' };\n    state.route = tabToRoute[state.tab] || 'settings';\n    render();\n  });\n});\n\n// Character counters\nconst titleFld = document.getElementById('titleFld');\nconst summaryFld = document.getElementById('summaryFld');\ntitleFld.addEventListener('input', ()=> document.getElementById('titleCount').textContent = titleFld.value.length);\nsummaryFld.addEventListener('input', ()=> document.getElementById('summaryCount').textContent = summaryFld.value.length);\n\n// Member search\ndocument.getElementById('memSearch').addEventListener('input', (e)=>{\n  const q = e.target.value.toLowerCase();\n  document.querySelectorAll('#memberList .mrow').forEach(r=>{\n    r.style.display = r.dataset.name.includes(q) ? '' : 'none';\n  });\n});\n\n// Remove member\ndocument.querySelectorAll('.btn-danger').forEach(b=>{\n  b.addEventListener('click', (e)=>{\n    if (b.dataset.action === 'decline' || !b.dataset.action) {\n      const row = b.closest('.mrow');\n      if (!row) return;\n      row.style.transition = 'opacity .2s';\n      row.style.opacity = '0';\n      setTimeout(()=>{\n        row.remove();\n        // update counts\n        const active = document.querySelectorAll('#memberList .mrow').length;\n        const activeCount = document.getElementById('activeCount');\n        if (activeCount) activeCount.textContent = active + ' members';\n        const pending = document.querySelectorAll('#pendingList .mrow').length;\n        const pc = document.getElementById('pendingCount');\n        if (pc) pc.textContent = pending;\n      }, 200);\n    }\n  });\n});\n\n// Approve pending\ndocument.querySelectorAll('.btn-success').forEach(b=>{\n  b.addEventListener('click', ()=>{\n    const row = b.closest('.mrow');\n    if (!row) return;\n    const nameEl = row.querySelector('.n');\n    const descEl = row.querySelector('.d');\n    const av = row.querySelector('.av');\n    const newRow = document.createElement('div');\n    newRow.className = 'mrow';\n    newRow.dataset.name = nameEl.textContent.toLowerCase();\n    newRow.innerHTML = `\n      <div class=\"av\" style=\"${av.getAttribute('style')}\">${av.textContent}<\u002Fdiv>\n      <div class=\"tx\">\n        <div class=\"n\">${nameEl.textContent}<\u002Fdiv>\n        <div class=\"d\">${descEl.textContent.replace(/Applied:\\s*/,'').replace(/ · Applied.*$/,' · Just joined')}<\u002Fdiv>\n      <\u002Fdiv>\n      <select class=\"select\"><option>Member<\u002Foption><option>Lead<\u002Foption><option>Viewer<\u002Foption><\u002Fselect>\n      <button class=\"btn-danger\">Remove<\u002Fbutton>\n    `;\n    document.getElementById('memberList').appendChild(newRow);\n    // rebind remove\n    newRow.querySelector('.btn-danger').addEventListener('click', ()=>{\n      newRow.style.opacity='0';\n      setTimeout(()=>{\n        newRow.remove();\n        const c = document.getElementById('activeCount');\n        if (c) c.textContent = document.querySelectorAll('#memberList .mrow').length + ' members';\n      },200);\n    });\n    row.style.opacity='0';\n    setTimeout(()=>{\n      row.remove();\n      const pc = document.getElementById('pendingCount');\n      if (pc) pc.textContent = document.querySelectorAll('#pendingList .mrow').length;\n      const c = document.getElementById('activeCount');\n      if (c) c.textContent = document.querySelectorAll('#memberList .mrow').length + ' members';\n    },200);\n  });\n});\n\n// Shared history data — drives both Settings > History and right-rail History\nconst HISTORY = [\n  { day:'Today', time:'10:32 AM', f:'whiteboards', ic:'✏️', iccls:'', html:'<b>Michael Smith<\u002Fb> created whiteboard <em>Brainstorm Concepts<\u002Fem>' },\n  { day:'Today', time:'10:05 AM', f:'chat', ic:'💬', iccls:'', html:'<b>Aisha Patel<\u002Fb> sent a chat message <q>\"Great progress everyone!\"<\u002Fq>' },\n  { day:'Today', time:'9:48 AM', f:'settings', ic:'⚙️', iccls:'', html:'<b>Michael Smith<\u002Fb> updated project summary' },\n  { day:'Today', time:'8:50 AM', f:'members', ic:'👤', iccls:'', html:'<b>Michael Smith<\u002Fb> invited <span class=\"green-t\">Aisha Patel<\u002Fspan>' },\n  { day:'Today', time:'8:20 AM', f:'tasks', ic:'✅', iccls:'green', html:'<b>Robert Chen<\u002Fb> completed task <em>Set up dev environment<\u002Fem>' },\n  { day:'Today', time:'8:05 AM', f:'files', ic:'📄', iccls:'', html:'<b>Jennifer Williams<\u002Fb> uploaded file <span class=\"red-t\">Research-Report.pdf<\u002Fspan>' },\n  { day:'Yesterday', time:'4:10 PM', f:'memos', ic:'📝', iccls:'', html:'<b>Jennifer Williams<\u002Fb> updated memo <em>Empathy Mapping Exercise<\u002Fem>' },\n  { day:'Yesterday', time:'3:22 PM', f:'files', ic:'📄', iccls:'red', html:'<b>Robert Chen<\u002Fb> removed file <span class=\"red-t\">Old-Draft-v1.pdf<\u002Fspan>' },\n  { day:'Yesterday', time:'2:30 PM', f:'members', ic:'👤', iccls:'', html:'<b>Robert Chen<\u002Fb> joined the room' },\n  { day:'Yesterday', time:'1:45 PM', f:'memos', ic:'📝', iccls:'', html:'<b>Jennifer Williams<\u002Fb> created memo <em>Business Model Canvas<\u002Fem>' },\n  { day:'Yesterday', time:'11:12 AM', f:'whiteboards', ic:'✏️', iccls:'', html:'<b>Michael Smith<\u002Fb> edited whiteboard <em>Brainstorm Concepts<\u002Fem>' },\n  { day:'Dec 20', time:'3:00 PM', f:'settings', ic:'⚙️', iccls:'', html:'<b>Michael Smith<\u002Fb> updated cover image' },\n  { day:'Dec 20', time:'10:30 AM', f:'tasks', ic:'✅', iccls:'green', html:'<b>Aisha Patel<\u002Fb> completed task <em>Data schema review<\u002Fem>' },\n  { day:'Dec 20', time:'9:15 AM', f:'members', ic:'👤', iccls:'', html:'<b>Jennifer Williams<\u002Fb> joined the room' },\n  { day:'Dec 20', time:'9:00 AM', f:'settings', ic:'⚙️', iccls:'', html:'<b>Michael Smith<\u002Fb> created the project room' }\n];\nlet histFilter = 'all';\n\nfunction renderSettingsHistory(){\n  const panel = document.querySelector('[data-panel=\"history\"]');\n  if (!panel) return;\n  // Remove any pre-existing day groups we rendered\n  panel.querySelectorAll('.dyn-day, .dyn-group').forEach(n=>n.remove());\n  const byDay = {};\n  HISTORY.filter(e => histFilter === 'all' || e.f === histFilter).forEach(e=>{\n    (byDay[e.day] = byDay[e.day] || []).push(e);\n  });\n  const frag = document.createDocumentFragment();\n  Object.keys(byDay).forEach(day=>{\n    const label = document.createElement('div');\n    label.className = 'day-label dyn-day';\n    label.textContent = day;\n    frag.appendChild(label);\n    const group = document.createElement('div');\n    group.className = 's-card dyn-group';\n    group.style.padding = '0';\n    byDay[day].forEach(e=>{\n      const row = document.createElement('div');\n      row.className = 'hrow';\n      row.dataset.f = e.f;\n      row.innerHTML = `<div class=\"ic ${e.iccls}\">${e.ic}<\u002Fdiv><div class=\"tx\">${e.html}<\u002Fdiv><div class=\"time\">${e.time}<\u002Fdiv>`;\n      group.appendChild(row);\n    });\n    frag.appendChild(group);\n  });\n  panel.appendChild(frag);\n  const countEl = panel.querySelector('.hfilters .count');\n  if (countEl) countEl.textContent = HISTORY.filter(e=>histFilter==='all'||e.f===histFilter).length + ' events';\n}\n\nfunction renderRailHistory(){\n  const list = document.getElementById('railHistList');\n  if (list) {\n    list.innerHTML = '';\n    HISTORY.filter(e => histFilter === 'all' || e.f === histFilter).slice(0, 4).forEach(e=>{\n      const row = document.createElement('div');\n      row.className = 'hist-item';\n      row.innerHTML = `<div class=\"ic\">${e.ic}<\u002Fdiv><div class=\"bd\">${e.html}<span class=\"t\">${e.day} · ${e.time}<\u002Fspan><\u002Fdiv>`;\n      list.appendChild(row);\n    });\n  }\n  const actList = document.getElementById('actFeedList');\n  if (actList) {\n    actList.innerHTML = '';\n    const items = ACTIVITY_FEED();\n    items.forEach(e=>{\n      const row = document.createElement('div');\n      row.className = 'act-row';\n      const lead = e.kind === 'chat'\n        ? `<div class=\"av\" style=\"background:${e.avBg};\">${e.avText}<\u002Fdiv>`\n        : `<div class=\"ic\">${e.ic}<\u002Fdiv>`;\n      const tagCls = e.kind === 'chat' ? 'tag chat' : 'tag';\n      const tagText = e.kind === 'chat' ? 'Chat' : (e.f.charAt(0).toUpperCase() + e.f.slice(1));\n      row.innerHTML = `${lead}<div class=\"bd\">${e.html}<div class=\"meta\"><span class=\"${tagCls}\">${tagText}<\u002Fspan><span>${e.day} · ${e.time}<\u002Fspan><\u002Fdiv><\u002Fdiv>`;\n      actList.appendChild(row);\n    });\n    // Cap visible rows at 10 — total height of first 10 children\n    requestAnimationFrame(()=>{\n      const rows = actList.querySelectorAll('.act-row');\n      if (rows.length > 10) {\n        const tenth = rows[9];\n        const h = tenth.offsetTop + tenth.offsetHeight - actList.firstElementChild.offsetTop;\n        actList.style.maxHeight = h + 'px';\n      } else {\n        actList.style.maxHeight = '';\n      }\n    });\n    const cnt = document.getElementById('actFeedCount');\n    if (cnt) cnt.textContent = items.length + ' items';\n  }\n}\n\n// Build a unified, chronological activity feed (chat + history)\nfunction ACTIVITY_FEED(){\n  const chat = [\n    { kind:'chat', day:'Today', time:'11:05 AM', _ts: 11*60+5, _d: 0, avText:'JW', avBg:'linear-gradient(135deg,#E56B5D,#C34A3C)',\n      html:'<b>Jennifer Williams<\u002Fb> in <em>#general<\u002Fem>: <q>\"Just updated the Business Model Canvas!\"<\u002Fq>' },\n    { kind:'chat', day:'Today', time:'10:05 AM', _ts: 10*60+5, _d: 0, avText:'AP', avBg:'linear-gradient(135deg,#4CB4B4,#2F8E8E)',\n      html:'<b>Aisha Patel<\u002Fb> in <em>#general<\u002Fem>: <q>\"Great progress everyone!\"<\u002Fq>' },\n    { kind:'chat', day:'Today', time:'9:20 AM', _ts: 9*60+20, _d: 0, avText:'RC', avBg:'linear-gradient(135deg,#A674E3,#7F4ACB)',\n      html:'<b>Robert Chen<\u002Fb> in <em>#general<\u002Fem>: <q>\"Pushed the schema migration — heads up.\"<\u002Fq>' },\n  ];\n  // assign rough sortable values to history (use array index since it's already newest-first)\n  const hist = HISTORY.map((e, i)=>({ kind:'history', _idx: i, ...e }));\n  // Merge: keep relative order — chat is newest, then history in its given order\n  return [...chat, ...hist];\n}\n\nfunction setHistFilter(f){\n  histFilter = f;\n  document.querySelectorAll('#histFilters .chip, #railFilters .chip').forEach(c=>{\n    c.classList.toggle('on', c.dataset.f === f);\n  });\n  // Sync new dropdown\n  const ft = document.getElementById('filterTypes');\n  if (ft) {\n    ft.querySelectorAll('.opt').forEach(o => o.classList.toggle('on', o.dataset.f === f));\n    const lbl = ft.querySelector('.lbl');\n    const sel = ft.querySelector('.opt.on');\n    if (lbl && sel) lbl.textContent = sel.textContent;\n  }\n  renderSettingsHistory();\n  renderRailHistory();\n  applyHistSearch();\n}\n\ndocument.querySelectorAll('#histFilters .chip, #railFilters .chip').forEach(c=>{\n  c.addEventListener('click', ()=> setHistFilter(c.dataset.f));\n});\n\n// New dropdowns — toggle open/close\ndocument.querySelectorAll('.hist-select').forEach(sel=>{\n  sel.addEventListener('click', (e)=>{\n    e.stopPropagation();\n    const wasOpen = sel.classList.contains('open');\n    document.querySelectorAll('.hist-select.open').forEach(s=>s.classList.remove('open'));\n    if (!wasOpen) sel.classList.add('open');\n  });\n  sel.querySelectorAll('.opt').forEach(opt=>{\n    opt.addEventListener('click', (e)=>{\n      e.stopPropagation();\n      sel.querySelectorAll('.opt').forEach(o=>o.classList.remove('on'));\n      opt.classList.add('on');\n      const lbl = sel.querySelector('.lbl');\n      if (lbl) lbl.textContent = opt.textContent;\n      sel.classList.remove('open');\n      // Type filter drives history\n      if (sel.id === 'filterTypes' && opt.dataset.f) {\n        setHistFilter(opt.dataset.f);\n      }\n    });\n  });\n});\ndocument.addEventListener('click', ()=>{\n  document.querySelectorAll('.hist-select.open').forEach(s=>s.classList.remove('open'));\n});\n\n// Search across history\nfunction applyHistSearch(){\n  const inp = document.getElementById('histSearch');\n  if (!inp) return;\n  const q = inp.value.trim().toLowerCase();\n  const panel = document.querySelector('[data-panel=\"history\"]');\n  if (!panel) return;\n  let visible = 0;\n  panel.querySelectorAll('.hrow').forEach(r=>{\n    const text = r.textContent.toLowerCase();\n    const hit = !q || text.includes(q);\n    r.style.display = hit ? '' : 'none';\n    if (hit) visible++;\n  });\n  // Hide empty day groups\n  panel.querySelectorAll('.dyn-group').forEach(g=>{\n    const any = [...g.querySelectorAll('.hrow')].some(r => r.style.display !== 'none');\n    g.style.display = any ? '' : 'none';\n    const lbl = g.previousElementSibling;\n    if (lbl && lbl.classList.contains('dyn-day')) lbl.style.display = any ? '' : 'none';\n  });\n}\nconst histSearchEl = document.getElementById('histSearch');\nif (histSearchEl) histSearchEl.addEventListener('input', applyHistSearch);\n\n// Export\ndocument.getElementById('exportHistory').addEventListener('click', ()=>{\n  const rows = HISTORY.filter(e=>histFilter==='all'||e.f===histFilter);\n  const csv = ['Day,Time,Category,Event'].concat(\n    rows.map(e => [e.day, e.time, e.f, e.html.replace(/<[^>]+>/g,'').replace(/\"/g,'\"\"')].map(v=>`\"${v}\"`).join(','))\n  ).join('\\n');\n  const blob = new Blob([csv], {type:'text/csv'});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url; a.download = 'project-room-history.csv'; a.click();\n  URL.revokeObjectURL(url);\n});\n\nrenderSettingsHistory();\nrenderRailHistory();\napplyHistSearch();\n\n// Activity hub tabs\nfunction setHubTab(name){\n  document.querySelectorAll('#hubTabs .hub-tab').forEach(b=>{\n    b.classList.toggle('on', b.dataset.hub === name);\n  });\n  document.querySelectorAll('[data-hub-panel]').forEach(p=>{\n    p.classList.toggle('on', p.dataset.hubPanel === name);\n  });\n}\ndocument.querySelectorAll('#hubTabs .hub-tab').forEach(b=>{\n  b.addEventListener('click', ()=> setHubTab(b.dataset.hub));\n});\ndocument.querySelectorAll('[data-hub-jump]').forEach(a=>{\n  a.addEventListener('click', (e)=>{ e.preventDefault(); setHubTab(a.dataset.hubJump); });\n});\n\n// Tweaks protocol\nwindow.addEventListener('message', (e)=>{\n  const d = e.data || {};\n  if (d.type === '__activate_edit_mode') tweaks.classList.add('show');\n  else if (d.type === '__deactivate_edit_mode') tweaks.classList.remove('show');\n});\nif (window.parent !== window) {\n  window.parent.postMessage({ type:'__edit_mode_available' }, '*');\n}\n\nrender();\n\n// Sidebar collapse toggle\nconst shellEl = document.getElementById('shell');\nconst sbToggle = document.getElementById('sidebarToggle');\nconst sbExpand = document.getElementById('sidebarExpand');\nfunction setSidebar(collapsed){\n  shellEl.classList.toggle('sidebar-collapsed', collapsed);\n  try { localStorage.setItem('projectRoomSidebar', collapsed ? '1' : '0'); } catch(e){}\n}\nif (sbToggle) sbToggle.addEventListener('click', ()=> setSidebar(true));\nif (sbExpand) sbExpand.addEventListener('click', ()=> setSidebar(false));\ntry {\n  if (localStorage.getItem('projectRoomSidebar') === '1') setSidebar(true);\n} catch(e){}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

<script>
(function(){
  function build(){
    if(document.getElementById('mhpc')) return;
    var css='#mhpc{position:fixed;top:12px;right:12px;z-index:2147483000;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif}#mhpc *{box-sizing:border-box}#mhpc .mhpc-toggle{display:flex;align-items:center;gap:8px;background:#0f172a;color:#fff;border:none;border-radius:999px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.28)}#mhpc .mhpc-toggle svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2}#mhpc .mhpc-panel{display:none;margin-top:8px;width:252px;background:#fff;color:#0f172a;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 22px 55px rgba(0,0,0,.24);padding:14px}#mhpc.open .mhpc-panel{display:block}#mhpc .mhpc-cap{font-size:12px;color:#64748b;margin:0 0 12px;line-height:1.4}#mhpc .mhpc-h{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#64748b;margin:0 0 6px}#mhpc .mhpc-row+.mhpc-row{margin-top:13px}#mhpc .mhpc-seg{display:flex;background:#f1f5f9;border-radius:10px;padding:3px;gap:3px}#mhpc .mhpc-seg button{flex:1;border:none;background:none;padding:7px 4px;font-size:11.5px;font-weight:600;color:#475569;border-radius:8px;cursor:pointer;line-height:1.15}#mhpc .mhpc-seg button.on{background:#fff;color:#0f172a;box-shadow:0 1px 3px rgba(0,0,0,.16)}';
    var st=document.createElement('style');st.id='mhpc-style';st.textContent=css;document.head.appendChild(st);
    var box=document.createElement('div');box.id='mhpc';box.className='open';
    box.innerHTML='<button class="mhpc-toggle" id="mhpc-btn" aria-label="Prototype controls"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h8M16 18h4"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="14" cy="18" r="2"/></svg>Prototype controls</button><div class="mhpc-panel"><p class="mhpc-cap">Explore every version of this prototype.</p><div class="mhpc-row"><p class="mhpc-h">UI</p><div class="mhpc-seg" data-group="platform"><button data-val="enterprise">Enterprise Platform</button><button data-val="bold">Hackathon App</button></div></div><div class="mhpc-row"><p class="mhpc-h">Appearance</p><div class="mhpc-seg" data-group="mode"><button data-val="light">Light Mode</button><button data-val="dark">Dark Mode</button></div></div><div class="mhpc-row"><p class="mhpc-h">Data set</p><div class="mhpc-seg" data-group="data"><button data-val="fill">Fill</button><button data-val="empty">Empty state</button></div></div></div>';
    document.body.appendChild(box);
    box.querySelector('#mhpc-btn').addEventListener('click',function(){box.classList.toggle('open');});
    var platform='bold',dark=false,filled=false;
    function readState(){var m=(document.body.className||'').match(/theme-([a-z\-]+)/);var theme=m?m[1]:'bold';dark=/-dark$/.test(theme);platform=theme.replace(/-dark$/,'')||'bold';try{var s=JSON.parse(localStorage.getItem('projectRoomState')||'{}');if(typeof s.filled==='boolean')filled=s.filled;}catch(e){}}
    function themeVal(){return platform+(dark?'-dark':'');}
    function setSeg(g,v){box.querySelectorAll('.mhpc-seg[data-group="'+g+'"] button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-val')===v);});}
    function paint(){setSeg('platform',platform);setSeg('mode',dark?'dark':'light');setSeg('data',filled?'fill':'empty');}
    box.querySelectorAll('.mhpc-seg button').forEach(function(b){b.addEventListener('click',function(){var g=b.parentElement.getAttribute('data-group'),v=b.getAttribute('data-val');if(g==='platform'){platform=v;if(window.applyTheme)window.applyTheme(themeVal());}else if(g==='mode'){dark=(v==='dark');if(window.applyTheme)window.applyTheme(themeVal());}else{filled=(v==='fill');if(window.applyState)window.applyState(filled);}paint();});});
    readState();paint();
  }
  var tries=0;
  (function ready(){
    if(window.applyTheme&&window.applyState&&document.body){build();}
    else if(tries++<150){setTimeout(ready,80);}
    else if(document.body){build();}
  })();
})();
</script>
