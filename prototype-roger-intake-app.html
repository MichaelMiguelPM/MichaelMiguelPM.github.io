      return crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
    }).then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
    }).then(function(buf){
      try{sessionStorage.setItem('roger-pw',pw)}catch(x){}
      var html=new TextDecoder().decode(buf);
      document.open();document.write(html);document.close();
    });
  }
  var f=document.getElementById('gate'),pw=document.getElementById('pw'),btn=document.getElementById('go'),err=document.getElementById('err');
  f.addEventListener('submit',function(ev){
    ev.preventDefault();btn.disabled=true;err.textContent='';
    open(pw.value.trim().replace(/\s+/g,' ').toLowerCase()).catch(function(){btn.disabled=false;err.textContent='That password is not right. Try again.';pw.select();});
  });
  var saved=null;try{saved=sessionStorage.getItem('roger-pw')}catch(x){}
  if(saved){open(saved).catch(function(){try{sessionStorage.removeItem('roger-pw')}catch(x){}})}
})();
</script>
</body>
</html>
